<!doctype html>
<meta charset="utf-8">
<title>legacy renderAt fixture</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="stage" width="160" height="90"></canvas>
<script>
  // A pre-protocol page: renderAt(frame) + __ready, no __meta / __frame.
  const ctx = document.getElementById("stage").getContext("2d");
  window.renderAt = (f) => { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 160, 90); ctx.fillStyle = "#fff"; ctx.fillRect(f * 10, 30, 20, 20); };
  window.__ready = true;
</script>
